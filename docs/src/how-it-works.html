<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#f4f1ea}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d2e"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F2B632"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f4f1ea"/>
  <svg x="1436" y="46" width="108" height="90" viewBox="51.5 58 480 400"><g fill="#064B34"><path id="left-horn" d="M155 82 C140 121 135 150 132 169 C152 184 188 194 225 201 L196 252 C142 243 94 224 81 200 C71 179 87 158 100 143 Z"/><path id="right-horn" d="M428 82 C443 121 448 150 451 169 C431 184 395 194 358 201 L387 252 C441 243 489 224 502 200 C512 179 496 158 483 143 Z"/><path id="forehead" d="M242 199 H341 L376 262 L330 296 L316 373 H267 L253 296 L207 262 Z"/><path id="left-cheek" d="M135 262 H199 L208 286 C214 301 226 305 242 309 L254 374 L234 398 L201 308 H161 Z"/><path id="right-cheek" d="M448 262 H384 L375 286 C369 301 357 305 341 309 L329 374 L349 398 L382 308 H422 Z"/></g><path id="muzzle" fill="#EA8700" d="M265 385 H318 C322 385 324 387 327 390 L340 407 C342 409 342 412 340 414 L327 430 C324 433 321 434 317 434 H266 C262 434 259 433 256 430 L243 414 C241 412 241 409 243 407 L256 390 C259 387 261 385 265 385 Z"/></svg>

  <text x="60" y="92" fill="#0b3d2e" font-size="46" font-weight="700">How Plowline works</text>
  <text x="60" y="136" fill="#0b3d2e" fill-opacity=".7" font-size="24">Keep each agent's work separate. Land the work one merge at a time.</text>

  <g font-family="Cascadia Mono, Consolas, monospace" font-size="18" fill="#7C561D" font-weight="600">
    <text x="60" y="200">pl new</text><text x="450" y="200">one agent per lane</text>
    <text x="850" y="200">pl done → pl train</text><text x="1300" y="200">push once</text>
  </g>

  <rect x="60" y="220" width="320" height="430" rx="14" fill="#fbfaf6" stroke="#0b3d2e" stroke-width="2"/>
  <text x="88" y="270" fill="#0b3d2e" font-size="28" font-weight="700">Queue</text>
  <g fill="#0b3d2e" font-size="20">
    <text x="88" y="330">One claim per lane</text>
    <text x="88" y="385">Lists the files each</text><text x="88" y="411">lane will touch</text>
    <text x="88" y="466">Flags overlaps but</text><text x="88" y="492">doesn't block them</text>
    <text x="88" y="547">Kept in .git/plowline,</text><text x="88" y="573">never committed</text>
  </g>

  <g>
    <rect x="450" y="230" width="330" height="120" rx="14" fill="#fbfaf6" stroke="#d9d3c4" stroke-width="2"/>
    <text x="476" y="276" fill="#0b3d2e" font-size="24" font-weight="700">Agent A</text>
    <text x="476" y="310" fill="#0b3d2e" fill-opacity=".7" font-size="19">own worktree · branch lane/a</text>
    <text x="476" y="334" fill="#0b3d2e" fill-opacity=".7" font-size="19">commits only in its own worktree</text>
    <rect x="450" y="375" width="330" height="120" rx="14" fill="#fbfaf6" stroke="#d9d3c4" stroke-width="2"/>
    <text x="476" y="421" fill="#0b3d2e" font-size="24" font-weight="700">Agent B</text>
    <text x="476" y="455" fill="#0b3d2e" fill-opacity=".7" font-size="19">own worktree · branch lane/b</text>
    <text x="476" y="479" fill="#0b3d2e" fill-opacity=".7" font-size="19">commits only in its own worktree</text>
    <rect x="450" y="520" width="330" height="120" rx="14" fill="#fbfaf6" stroke="#d9d3c4" stroke-width="2"/>
    <text x="476" y="566" fill="#0b3d2e" font-size="24" font-weight="700">Agent C</text>
    <text x="476" y="600" fill="#0b3d2e" fill-opacity=".7" font-size="19">own worktree · branch lane/c</text>
    <text x="476" y="624" fill="#0b3d2e" fill-opacity=".7" font-size="19">commits only in its own worktree</text>
  </g>
  <g stroke="#0b3d2e" stroke-width="2.5" marker-end="url(#a)">
    <line x1="380" y1="290" x2="446" y2="290"/><line x1="380" y1="435" x2="446" y2="435"/><line x1="380" y1="580" x2="446" y2="580"/>
    <line x1="780" y1="290" x2="846" y2="290"/><line x1="780" y1="435" x2="846" y2="435"/><line x1="780" y1="580" x2="846" y2="580"/>
    <line x1="1230" y1="440" x2="1296" y2="440"/>
  </g>

  <rect x="850" y="220" width="380" height="430" rx="14" fill="#fbfaf6" stroke="#F2B632" stroke-width="2.5"/>
  <text x="878" y="270" fill="#0b3d2e" font-size="28" font-weight="700">Merge train</text>
  <g font-size="21" fill="#0b3d2e">
    <circle cx="893" cy="323" r="15" fill="#F2B632"/><text x="887" y="330" fill="#0b3d2e" font-weight="700">1</text>
    <text x="920" y="330">Take lanes that passed review</text>
    <circle cx="893" cy="378" r="15" fill="#F2B632"/><text x="887" y="385" fill="#0b3d2e" font-weight="700">2</text>
    <text x="920" y="385">Merge them all onto main</text>
    <circle cx="893" cy="433" r="15" fill="#F2B632"/><text x="887" y="440" fill="#0b3d2e" font-weight="700">3</text>
    <text x="920" y="440">Run one combined test gate</text>
    <circle cx="893" cy="488" r="15" fill="#F2B632"/><text x="887" y="495" fill="#0b3d2e" font-weight="700">4</text>
    <text x="920" y="495">Push once</text>
  </g>
  <line x1="878" y1="540" x2="1202" y2="540" stroke="#d9d3c4" stroke-width="2"/>
  <text x="878" y="582" fill="#0b3d2e" fill-opacity=".7" font-size="19">No rebases: the commits that were</text>
  <text x="878" y="608" fill="#0b3d2e" fill-opacity=".7" font-size="19">reviewed are the ones that ship.</text>

  <rect x="1300" y="380" width="240" height="120" rx="14" fill="#0b3d2e"/>
  <text x="1420" y="438" fill="#f4f1ea" font-size="30" font-weight="700" text-anchor="middle">main</text>
  <text x="1420" y="472" fill="#f4f1ea" fill-opacity=".75" font-size="18" text-anchor="middle">one push per train</text>

  <path d="M1040,650 L1040,720 L615,720 L615,646" fill="none" stroke="#F2B632" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#g)"/>
  <text x="640" y="758" fill="#0b3d2e" font-size="20" font-weight="600">Conflict or red gate: that lane goes back to its own worktree (pl resume)</text>
  <text x="640" y="786" fill="#0b3d2e" fill-opacity=".8" font-size="20">to merge main, fix and retry. The other lanes still land.</text>

  <text x="60" y="860" fill="#0b3d2e" fill-opacity=".65" font-size="19">Files that every lane changes (generated docs, manifests) are rebuilt once at merge time, not by each agent.</text>
</svg></body></html>
